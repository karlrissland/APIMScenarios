name: APIM - Extract APIs and Artifacts

on:
  workflow_call:
    #NOTE: workflow_call doesn't support choice inputs, have to constrain in calling workflow
    inputs:
      environment:
        description: 'environment to extract from'
        required: true
        type: string
        default: 'dev'
      USE_CONFIG_FILE: 
        description: 'Use Config File to Choose APIs to Extract'
        required: false
        type: boolean
        default: false

  workflow_dispatch:
    inputs:
      environment: 
        description: 'environment to extract from'
        required: true
        type: environment
      USE_CONFIG_FILE: 
        description: 'Use Config File to Choose APIs to Extract'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  APIM-extract-apis:
    runs-on: ubuntu-latest
    environment: ${{inputs.environment}}
    env:
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP_NAME: ${{ vars.AZURE_RESOURCE_GROUP_NAME }}
      API_MANAGEMENT_SERVICE_NAME: ${{ vars.API_MANAGEMENT_SERVICE_NAME }}
      API_MANAGEMENT_SERVICE_OUTPUT_FOLDER_PATH: ${{ GITHUB.WORKSPACE }}/src/APIM  # change this to the artifacts folder
      APIM_FILTER_PATH: ${{ vars.APIM_FILTER_PATH }}
      APIM_NO_TRANSITIVE: ${{ vars.APIM_NO_TRANSITIVE }}
      
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install APIOps CLI
        run: npm install --global @azure-tools/apiops-cli@1.0.5

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          creds: >-
            {"clientId":${{ toJSON(secrets.AZURE_CLIENT_ID) }},"clientSecret":${{ toJSON(secrets.AZURE_CLIENT_SECRET) }},"tenantId":${{ toJSON(secrets.AZURE_TENANT_ID) }},"subscriptionId":${{ toJSON(secrets.AZURE_SUBSCRIPTION_ID) }}}

      - name: Run extractor
        shell: pwsh
        env:
          USE_CONFIG_FILE: ${{ inputs.USE_CONFIG_FILE }}
        run: |
          $ErrorActionPreference = 'Stop'
          $parameters = @{
            ArtifactPath = $env:API_MANAGEMENT_SERVICE_OUTPUT_FOLDER_PATH
            NoTransitive = $env:APIM_NO_TRANSITIVE -eq 'true'
          }
          if ($env:USE_CONFIG_FILE -eq 'true') {
            $parameters.FilterPath = './src/apim-extract-configuration.yaml'
          }
          if ($env:APIM_FILTER_PATH) { $parameters.FilterPath = $env:APIM_FILTER_PATH }
          & ./scripts/Extract-ApimArtifacts.ps1 @parameters
      
      - name: publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-from-portal
          path: ${{ env.API_MANAGEMENT_SERVICE_OUTPUT_FOLDER_PATH }}
          if-no-files-found: error
          
      - name: Create artifacts pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: src/APIM
          branch: apim-extract-${{ inputs.environment }}
          commit-message: "updated extract from apim instance ${{ env.API_MANAGEMENT_SERVICE_OUTPUT_FOLDER_PATH }}"
          title: "${{ env.API_MANAGEMENT_SERVICE_OUTPUT_FOLDER_PATH }} - extract"
          body: >
            This PR is auto-generated by Github actions workflow
          labels: extract, automated pr    
