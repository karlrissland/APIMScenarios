name: APIM - Publish APIs and Artifacts

on:
  workflow_call:
    #NOTE: workflow_call doesn't support choice inputs, have to constrain in calling workflow
    inputs:
      environment:
        description: 'environment to publish to'
        required: true
        type: string
        default: 'dev'
      USE_CONFIG_FILE:
        description: 'whether or not to use a config file to override settings'
        required: false
        type: boolean
        default: false
      DRY_RUN:
        description: 'Preview publishing without changing APIM'
        required: false
        type: boolean
        default: false

  workflow_dispatch:
    inputs:
      environment: 
        description: 'environment to publish to'
        required: true
        type: environment
      USE_CONFIG_FILE:
        description: 'whether or not to use a config file to override settings'
        required: false
        type: boolean
        default: false
      DRY_RUN:
        description: 'Preview publishing without changing APIM'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  APIM-Import-APIs:
    runs-on: ubuntu-latest
    environment: ${{inputs.environment}}
    
    env:
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP_NAME: ${{ vars.AZURE_RESOURCE_GROUP_NAME }}
      API_MANAGEMENT_SERVICE_NAME: ${{ vars.API_MANAGEMENT_SERVICE_NAME }}
      API_MANAGEMENT_SERVICE_OUTPUT_FOLDER_PATH: ${{ GITHUB.WORKSPACE }}/src/APIM  ## location of API assets
      APIM_FILTER_PATH: ${{ vars.APIM_FILTER_PATH }}
      APIM_NO_TRANSITIVE: ${{ vars.APIM_NO_TRANSITIVE }}
      FUNCTION_SERVICE_NAME: ${{ vars.FUNCTION_SERVICE_NAME }}
      FUNCTION_BACKEND_URL: ${{ vars.FUNCTION_BACKEND_URL }}
      FUNCTION_RESOURCE_GROUP_NAME: ${{ vars.FUNCTION_RESOURCE_GROUP_NAME }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install APIOps CLI
        run: npm install --global @azure-tools/apiops-cli@1.0.5

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          creds: >-
            {"clientId":${{ toJSON(secrets.AZURE_CLIENT_ID) }},"clientSecret":${{ toJSON(secrets.AZURE_CLIENT_SECRET) }},"tenantId":${{ toJSON(secrets.AZURE_TENANT_ID) }},"subscriptionId":${{ toJSON(secrets.AZURE_SUBSCRIPTION_ID) }}}

      - name: Run publisher
        shell: pwsh
        env:
          USE_CONFIG_FILE: ${{ inputs.USE_CONFIG_FILE }}
          APIM_PUBLISH_DRY_RUN: ${{ inputs.DRY_RUN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $parameters = @{
            ArtifactPath = $env:API_MANAGEMENT_SERVICE_OUTPUT_FOLDER_PATH
            NoTransitive = $env:APIM_NO_TRANSITIVE -eq 'true'
            DryRun = $env:APIM_PUBLISH_DRY_RUN -eq 'true'
          }
          if ($env:USE_CONFIG_FILE -eq 'true') {
            $parameters.OverridesPath = './src/apim-publish-configuration.yaml'
          }
          if ($env:APIM_FILTER_PATH) { $parameters.FilterPath = $env:APIM_FILTER_PATH }
          if ($env:FUNCTION_SERVICE_NAME -or $env:FUNCTION_BACKEND_URL) {
            $parameters.FunctionAppName = $env:FUNCTION_SERVICE_NAME
            $parameters.FunctionBackendUrl = $env:FUNCTION_BACKEND_URL
            if ($env:FUNCTION_RESOURCE_GROUP_NAME) {
              $parameters.FunctionResourceGroupName = $env:FUNCTION_RESOURCE_GROUP_NAME
            }
          }
          & ./scripts/Publish-ApimArtifacts.ps1 @parameters

